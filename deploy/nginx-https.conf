server {
    # Public 443 is owned by the existing SNI stream router.
    listen 127.0.0.1:8444 ssl;
    server_name codereview.frostraven05.com;
    ssl_certificate /etc/letsencrypt/live/codereview.frostraven05.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codereview.frostraven05.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/codeguard/site;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    location = /healthz { default_type text/plain; return 200 'ok\n'; }
    location = /updates/latest.yml {
        alias /opt/codeguard/updates/latest.yml;
        default_type text/yaml;
        add_header Cache-Control 'no-store';
    }
    location /updates/ {
        alias /opt/codeguard/updates/;
        autoindex off;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
    location / { try_files $uri $uri/ =404; add_header Cache-Control 'no-cache'; }
}
